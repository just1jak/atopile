name: Chrysler companion apps
on:
  workflow_dispatch:
  push:
    branches: [feature/chrysler-sd-checkpoint]
    paths:
      - 'projects/chrysler-scanner/apps/**'
      - '.github/workflows/chrysler-apps.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/chrysler-scanner/apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: projects/chrysler-scanner/apps/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - if: runner.os != 'Linux'
        run: npm run package --workspace @chrysler/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run package --workspace @chrysler/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-unsigned
          path: |
            projects/chrysler-scanner/apps/desktop/release/*.zip
            projects/chrysler-scanner/apps/desktop/release/*.exe
            projects/chrysler-scanner/apps/desktop/release/*.dmg
            projects/chrysler-scanner/apps/desktop/release/*.AppImage
            projects/chrysler-scanner/apps/desktop/release/*.deb
          if-no-files-found: error
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/chrysler-scanner/apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: projects/chrysler-scanner/apps/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: projects/chrysler-scanner/apps/mobile
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: projects/chrysler-scanner/apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-test-apk
          path: projects/chrysler-scanner/apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  mobile-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/chrysler-scanner/apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: projects/chrysler-scanner/apps/package-lock.json
      - run: npm ci
      - run: npm run export:mobile
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-javascript-only
          path: projects/chrysler-scanner/apps/mobile/dist
