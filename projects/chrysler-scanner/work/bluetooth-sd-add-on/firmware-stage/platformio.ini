[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_unflags = -std=gnu++11 -fno-exceptions
build_flags = -std=gnu++17 -fexceptions -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1
monitor_speed = 115200
board_build.partitions = default_8MB.csv
extra_scripts = post:tools/export_bundle.py

