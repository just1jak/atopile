# Copy this file to the FAT32 card root as /logger.cfg before first power-on.
# REQUIRED: replace with YOUR scanner BLE MAC, obtained from scanner HW/FW info.
# This placeholder is rejected, so the logger never binds a random nearby scanner.
scanner_address=00:00:00:00:00:00
scanner_address_type=public

# Explicit upstream passive-broadcast formulas; vehicle/year fit is not certified.
# Supported selected IDs below. Unsupported/raw SCI messages remain in raw logs.
decoder_profile=upstream_broadcast_2023
selected=engine_rpm,vehicle_speed_kph,manifold_absolute_pressure_kpa,battery_voltage_v,oil_pressure_kpa,coolant_temperature_c,ambient_temperature_c

# Enable only scanner receive paths, preserving its other existing setting bits.
# This can change scanner NVS configuration. No vehicle TX/diagnostic command.
enable_pci_rx=true
enable_ccd_rx=false
auto_start=true
flush_ms=1000

# 0 = no UTC; use host_us and scanner_ms. Optional value is Unix seconds at this
# EXACT boot. It is NOT an RTC and must be updated for each boot if used.
utc_epoch_at_boot=0
