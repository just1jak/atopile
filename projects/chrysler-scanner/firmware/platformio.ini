[platformio]
default_envs = rev_c_passive

[env:rev_c_passive]
platform = espressif32@6.12.0
framework = espidf
board = chrysler_rev_c
platform_packages = platformio/framework-espidf@3.50500.0
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
monitor_speed = 250000
build_flags = -std=gnu++17

[env:rev_d_can]
extends = env:rev_c_passive
build_flags = ${env:rev_c_passive.build_flags} -DSCANNER_REV_D=1
